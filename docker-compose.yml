services:
  ditch:
    build: .
    ports:
      - "3000:3000"
    volumes:
      # Local scratch space segments land in first — put this on fast local disk (SSD).
      - ./cache:/data/cache
      # Final destination for completed downloads — point this at your NFS mount in production
      # (see ADR-0005); a plain local bind mount works fine for local/dev use too.
      - ./downloads:/data/downloads
      - ./data:/data/db
    environment:
      - PORT=3000
      - CACHE_DIR=/data/cache
      - DOWNLOADS_DIR=/data/downloads
      - DB_PATH=/data/db/ditch.sqlite
    restart: unless-stopped
