services:
  ditch:
    build: .
    # Runs as this uid:gid instead of the image's baked-in default (1000:1000) — set PUID/PGID
    # in a .env file next to this compose file (or export them in your shell) to match whoever
    # owns the bind-mounted volumes below, especially the NFS one (see ADR-0006).
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "3000:3000"
    volumes:
      # Local scratch space segments land in first — put this on fast local disk (SSD).
      - ./cache:/data/cache
      # Final destination for completed downloads — point this at your NFS mount in production
      # (see ADR-0005); a plain local bind mount works fine for local/dev use too.
      - ./downloads:/data/downloads
      - ./data:/data/db
    environment:
      - PORT=3000
      - CACHE_DIR=/data/cache
      - DOWNLOADS_DIR=/data/downloads
      - DB_PATH=/data/db/ditch.sqlite
    restart: unless-stopped
