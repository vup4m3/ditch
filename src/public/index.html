<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ditch — Live Stream Downloader</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <h1>Ditch</h1>
    <p class="subtitle">貼上網頁網址，偵測可下載的串流</p>
  </header>

  <main>
    <section id="detect-section">
      <form id="detect-form">
        <input type="url" id="page-url" placeholder="https://example.com/live" required autocomplete="off" />
        <button type="submit" id="detect-button">偵測</button>
      </form>
      <p id="detect-status" class="status" hidden></p>
    </section>

    <section id="candidates-section" hidden>
      <h2>偵測到的項目</h2>
      <ul id="candidates-list"></ul>
    </section>

    <section id="active-downloads-section" hidden>
      <h2>下載中</h2>
      <ul id="active-downloads-list"></ul>
    </section>

    <section id="history-section">
      <h2>下載紀錄</h2>
      <table id="history-table">
        <thead>
          <tr>
            <th>檔名</th>
            <th>資料夾</th>
            <th>狀態</th>
            <th>進度</th>
            <th>來源</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="history-body"></tbody>
      </table>
    </section>
  </main>

  <div id="folder-modal-overlay" hidden>
    <div id="folder-modal" role="dialog" aria-modal="true" aria-labelledby="folder-modal-title">
      <h2 id="folder-modal-title">選擇目的資料夾</h2>
      <nav id="folder-breadcrumb"></nav>
      <p id="folder-modal-status" class="status" hidden></p>
      <ul id="folder-list"></ul>
      <form id="new-folder-form">
        <input type="text" id="new-folder-name" placeholder="新資料夾名稱" autocomplete="off" required />
        <button type="submit" class="secondary">新增資料夾</button>
      </form>
      <div id="folder-modal-actions">
        <button type="button" id="folder-modal-cancel" class="secondary">取消</button>
        <button type="button" id="folder-modal-confirm">選擇此資料夾</button>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
